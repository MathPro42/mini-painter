<?xml version="1.0" encoding="UTF-8"?>
<!--
  Synthetic paint-scheme sheet with tone layers. Like selection-map.svg, plus the
  conventions tone rendering relies on: Layer and Shade groups seen through masks set
  by class on their parent, a Highlight group with its own mask attribute under a
  transformed parent, and a "Met" picture hidden behind an empty mask.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 50"><defs><style>.cls-1{fill:none;}.cls-2{mask:url(#mask-layer);}.cls-3{mask:url(#mask-shade);}.cls-4{mask:url(#mask-empty);}</style><mask id="mask-layer" width="100" height="50" maskUnits="userSpaceOnUse"><rect width="100" height="25" fill="#fff"/></mask><mask id="mask-shade" width="100" height="50" maskUnits="userSpaceOnUse"><rect y="25" width="100" height="25" fill="#808080"/></mask><mask id="mask-highlight" width="100" height="50" maskUnits="userSpaceOnUse"><rect x="40" width="20" height="50" fill="#fff"/></mask><mask id="mask-empty" width="100" height="50" maskUnits="userSpaceOnUse"/></defs><g id="Background"><rect width="100" height="50" fill="#666"/></g><g id="Base"><rect class="cls-1" x="1" y="1" width="4" height="4"/></g><g class="cls-2"><g id="Layer"><rect class="cls-1" x="1" y="1" width="4" height="4"/></g></g><g class="cls-3"><g id="Shade"><rect class="cls-1" x="1" y="1" width="4" height="4"/></g></g><g transform="translate(0 0)"><g id="Highlight" mask="url(#mask-highlight)"><rect class="cls-1" x="1" y="1" width="4" height="4"/></g></g><g id="Image"><rect width="100" height="50" fill="#000" opacity="0.2"/></g><g class="cls-4"><g id="Met"><rect width="100" height="50" fill="#c0c0c0"/></g></g><g id="selectionMap"><g id="left"><rect class="cls-1" width="50" height="50"/></g><g id="right"><rect class="cls-1" x="50" width="50" height="50"/></g></g></svg>
