<?xml version="1.0" encoding="UTF-8"?>
<!--
  Synthetic paint-scheme sheet. It follows the layered convention the parser detects:
  flat-filled layers, masked shading layers, a raster "Image" overlay, and a
  "selectionMap" group whose invisible child groups are the paintable regions.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 120"><defs><style>.cls-1{fill:#878787;}.cls-2{fill:#fff;}.cls-3{mask:url(#mask);}.cls-4{mask:url(#mask-2);}.cls-5{fill:none;}.cls-6{isolation:isolate;}</style><mask id="mask" x="0" y="0" width="200" height="120" maskUnits="userSpaceOnUse"><rect width="200" height="60" fill="#fff"/></mask><mask id="mask-2" x="0" y="0" width="200" height="120" maskUnits="userSpaceOnUse"><rect y="60" width="200" height="60" fill="#fff"/></mask></defs><title>Sample sheet</title><g id="Background"><rect class="cls-1" width="200" height="120"/></g><g id="Base"><rect class="cls-2" x="2" y="2" width="6" height="6"/></g><g class="cls-3"><g id="Shade"><rect class="cls-2" x="2" y="2" width="6" height="6"/></g></g><g class="cls-4"><g id="Highlight"><rect class="cls-2" x="2" y="2" width="6" height="6"/></g></g><g id="Image"><image class="cls-6" width="200" height="120" xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAEUlEQVR4nGP4//9/AwgzwBgAgKAN9bWuqBwAAAAASUVORK5CYII="/></g><g id="selectionMap"><g id="one"><path class="cls-5" d="M20,20h60v60H20Z" transform="translate(0 0)"/></g><g id="two"><path class="cls-5" d="M120,50a30,30,0,1,0,60,0a30,30,0,1,0-60,0Z"/></g><g id="three"><polygon class="cls-5" points="90 90 110 90 100 110"/><path id="three-2" data-name="three" class="cls-5" d="m130 90 20 0-10 20z"/></g><g id="four"><path class="cls-5" fill-rule="evenodd" d="M20 90h40v25H20Z M30 95h20v15H30Z"/></g><polygon class="cls-5" points="2 112 8 112 5 118"/></g></svg>
